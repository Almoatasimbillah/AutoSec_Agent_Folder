[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-security-agent"
version = "0.1.0"
description = "Autonomous Security Research Agent — Architecture baseline & core execution skeleton"
authors = [{ name = "Security Research Team" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "sqlmodel>=0.0.14",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
